name: CI

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Install tools
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          go install github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Lint & Vet
        run: go vet ./...
      - name: Run unit tests
        run: go test -v ./...
      - name: Build binary
        run: go build -v ./cmd/api-gateway
      - name: Generate Swagger docs
        run: swag init -g cmd/api-gateway/main.go -o api/swagger --parseDependency --parseInternal
      - name: Validate Swagger routes cover gateway
        run: python3 scripts/validate_swagger_routes.py
      - name: Static compatibility contract check
        run: python3 scripts/compatibility_smoke.py

  contract-test:
    name: Contract Tests (Postman/Newman)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      BASE_URL: http://localhost:8080/api/v1
      GATEWAY_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: go build ./...
      - name: Start API server
        run: |
          go run ./cmd/api-gateway &
          echo $! > api.pid
          sleep 5
          curl -f http://localhost:8080/health || (echo "API failed to start" && exit 1)
      - name: Login to get ACCESS_TOKEN
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8080/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"superadmin@sma.test","password":"admin123"}')
          echo "ACCESS_TOKEN=$(echo $RESPONSE | jq -r '.data.access_token')" >> $GITHUB_ENV
          echo "Token acquired: $(echo $RESPONSE | jq -r '.data.access_token' | head -c 20)..."
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Newman
        run: npm install -g newman
      - name: Run contract tests (Public Gateway + Core Protected Smoke)
        env:
          ACCESS_TOKEN: ${{ env.ACCESS_TOKEN }}
        run: |
          newman run tests/contract/contract.postman_collection.json \
            --env-var baseUrl=$BASE_URL \
            --env-var gatewayUrl=$GATEWAY_URL \
            --env-var accessToken=$ACCESS_TOKEN \
            --folder "Public Gateway" \
            --folder "Core Protected Smoke" \
            --reporters cli,junit \
            --reporter-junit-export contract-test-results.xml
      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: contract-test-results.xml
      - name: Stop API server
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
          fi

  seeded-smoke-test:
    name: Seeded Compatibility Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      BASE_URL: http://localhost:8080/api/v1
      RUN_COMPATIBILITY_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Start Postgres & Redis
        run: |
          docker compose -f docker/docker-compose.yml up -d
          sleep 5
      - name: Run migrations
        run: make migrate-up
      - name: Seed test data
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/admin_panel_sma?sslmode=disable" -f scripts/seed.sql
      - name: Build and start API
        run: |
          go run ./cmd/api-gateway &
          echo $! > api.pid
          sleep 5
          curl -f http://localhost:8080/health || (echo "API failed to start" && exit 1)
      - name: Login to get ACCESS_TOKEN
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8080/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"superadmin@sma.test","password":"admin123"}')
          echo "ACCESS_TOKEN=$(echo $RESPONSE | jq -r '.data.access_token')" >> $GITHUB_ENV
      - name: Run seeded compatibility smoke
        env:
          ACCESS_TOKEN: ${{ env.ACCESS_TOKEN }}
          RUN_COMPATIBILITY_SMOKE: "1"
        run: python3 scripts/compatibility_smoke.py
      - name: Stop services
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
          fi
          docker compose -f docker/docker-compose.yml down