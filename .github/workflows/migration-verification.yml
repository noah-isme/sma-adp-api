name: Migration Verification

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: migration-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.mode }} migration path
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "${{ github.run_id }}"
          POSTGRES_DB: admin_panel_sma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d admin_panel_sma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: "postgresql://postgres:${{ github.run_id }}@localhost:5432/admin_panel_sma?sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install migration tool
        run: |
          go install github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres -d admin_panel_sma; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Verify migration path
        env:
          MIGRATION_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          case "$MIGRATION_MODE" in
            fresh)
              migrate -path migrations -database "$DB_URL" up
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/seed.sql
              ;;
            upgrade)
              migrate -path migrations -database "$DB_URL" goto 24
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/seed.sql
              migrate -path migrations -database "$DB_URL" up
              ;;
            *)
              echo "unknown migration mode: $MIGRATION_MODE" >&2
              exit 2
              ;;
          esac

          version="$(migrate -path migrations -database "$DB_URL" version 2>&1)"
          echo "Final migration version: $version"
          if ! printf '%s\n' "$version" | grep -Eq '^26([[:space:]]|$)'; then
            echo "expected migration version 26" >&2
            exit 1
          fi

          go run ./scripts/migration_integrity --dsn "$DB_URL" --json \
            > "migration-integrity-${MIGRATION_MODE}.json"
          grep -q '"passed": true' "migration-integrity-${MIGRATION_MODE}.json"
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-integrity-${{ matrix.mode }}
          path: migration-integrity-${{ matrix.mode }}.json
          if-no-files-found: ignore
