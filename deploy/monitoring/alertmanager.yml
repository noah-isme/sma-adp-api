# Replace the SMTP placeholders through the secret-management deployment
# process before starting Alertmanager. Keep this file free of real secrets.
global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.example.com:587
  smtp_from: alerts@example.com
  smtp_auth_username: alerts@example.com
  smtp_auth_password: REPLACE_IN_SECRET_STORE

route:
  receiver: operations-email
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: operations-email
      repeat_interval: 1h

receivers:
  - name: operations-email
    email_configs:
      - to: operations@example.com
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service]
