global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: sma-adp-api
    environment: production

rule_files:
  - /etc/prometheus/sma-api-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: sma-api
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: sma-adp-api
          environment: production
