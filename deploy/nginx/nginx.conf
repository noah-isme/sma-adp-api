worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
      '{"time":"$time_iso8601","request_id":"$request_id",'
      '"remote_addr":"$remote_addr","request":"$request",'
      '"status":$status,"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,"upstream":"$upstream_addr",'
      '"upstream_status":"$upstream_status"}';
    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

    include /tmp/nginx-conf/*.conf;
}
